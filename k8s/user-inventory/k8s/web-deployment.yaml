apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-inventory-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-inventory-web
  template:
    metadata:
      labels:
        app: user-inventory-web
    spec:
      containers:
        - name: web
          image: arupdeb381/user-invtry-web:1.0
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: db-service
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: inventory
            - name: DB_USER
              value: inventory
            - name: DB_PASSWORD
              value: inventory123
